name: TaxiScan Android build
on:
  push:
    paths:
      - 'TaxiScan_Improved_Project/**'
      - '.github/workflows/taxiscan-v2-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK
        working-directory: TaxiScan_Improved_Project
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TaxiScan-2.0.0-debug-apk
          path: TaxiScan_Improved_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
